<div class="overlay" *ngIf="visible">
  <div class="dialog">
    <h3>{{ titulo }}</h3>
    <p>{{ mensaje }}</p>
    <div class="acciones">
      <button class="btn btn-secundario" (click)="cancelar.emit()">Cancelar</button>
      <button class="btn btn-peligro" (click)="confirmar.emit()">Eliminar</button>
    </div>
  </div>
</div>
