<header class="header">
  <div class="titulo-bloque">
    <h1>Pokémon</h1>
    <p>Consulta y administra los Pokémon de tu colección.</p>
  </div>

  <div class="acciones-header">
    <div class="buscador">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8" />
        <path d="m20 20-3.2-3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      <input
        type="text"
        placeholder="Buscar Pokémon..."
        [ngModel]="pokemonService.busqueda()"
        (ngModelChange)="onBusquedaChange($event)"
      />
    </div>

    <button type="button" class="icono-boton" aria-label="Notificaciones">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path
          d="M6 10a6 6 0 0 1 12 0c0 3.2 1 4.6 1.6 5.4H4.4C5 14.6 6 13.2 6 10Z"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
        <path d="M10 18a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <span class="badge">3</span>
    </button>

    <div class="usuario">
      <div class="avatar-usuario">AK</div>
      <div class="usuario-info">
        <span class="usuario-nombre">Ash Ketchum</span>
        <span class="usuario-rol">Entrenador</span>
      </div>
    </div>
  </div>
</header>
