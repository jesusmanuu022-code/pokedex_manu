<aside class="sidebar">
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="10" fill="#fff" />
      <path d="M2 12h6.5a3.5 3.5 0 0 0 7 0H22" stroke="#e3350d" stroke-width="1.6" />
      <circle cx="12" cy="12" r="10" stroke="#212121" stroke-width="1.4" fill="none" />
      <circle cx="12" cy="12" r="3" fill="#fff" stroke="#212121" stroke-width="1.4" />
    </svg>
    <span>Pokédex</span>
  </div>

  <nav class="nav">
    <button
      type="button"
      class="nav-item"
      *ngFor="let item of items"
      [class.activo]="item.activo"
      [attr.aria-current]="item.activo ? 'page' : null"
    >
      <span class="nav-icono">
        <svg *ngIf="item.icono === 'pokebola'" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
          <path d="M3 12h6.2a2.8 2.8 0 0 0 5.6 0H21" stroke="currentColor" stroke-width="1.6" />
          <circle cx="12" cy="12" r="2.2" fill="currentColor" />
        </svg>
        <svg *ngIf="item.icono === 'usuario'" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6" />
          <path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <svg *ngIf="item.icono === 'rayo'" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
        <svg *ngIf="item.icono === 'info'" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 11v5.5M12 8v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </span>
      {{ item.etiqueta }}
    </button>
  </nav>
</aside>
